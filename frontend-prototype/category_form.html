<main>
    <h2>Додати категорію</h2>

    <form action="#" method="post" class="client-form">

        
<label for="category_name">Назва категорії</label>
<input type="text"
       id="category_name"
       name="category_name"
       maxlength="100"
       required>


        <label for="description">Опис категорії</label>
        <textarea id="description"
                  name="description"
                  maxlength="255"
                  rows="4"></textarea>

        <div class="form-actions">
            <button type="submit">Зберегти</button>

            <a href="categories.html" class="cancel-btn">
    Скасувати
</a>
        </div>
    </form>
