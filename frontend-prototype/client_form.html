</head>
<body>

<header>
    <h1>Фотоцентр</h1>
    <p>Система управління базою даних</p>
</header>

<nav>
    <a href="index.html">Клієнти</a>
    <a href="services.html">Послуги</a>

</nav>

<main>
    <h2>Додати клієнта</h2>

    <form action="#" method="post" class="client-form">

        <label for="full_name">ПІБ клієнта</label>
        <input
            type="text"
            id="full_name"
            name="full_name"
            maxlength="100"
            required
        >

        <label for="phone">Номер телефону</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            maxlength="20"
            required
        >

        <label for="birth_date">Дата народження</label>
        <input
            type="date"
            id="birth_date"
            name="birth_date"
        >

        <div class="form-actions">
            <button type="submit">Зберегти</button>
            <a href="index.html" class="cancel-btn">
                Скасувати
            </a>
        </div>

    </form>
</main>

</body>
</html>
