
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Фотоцентр — Редагування працівника</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Фотоцентр</h1>
    <p>Система управління базою даних</p>
</header>

<nav>
    <a href="index.html">Клієнти</a>
    <a href="services.html">Послуги</a>
    <a href="employees.html">Працівники</a>
    <a href="orders.html">Замовлення</a>
    <a href="bookings.html">Бронювання</a>
    <a href="halls.html">Фотозали</a>
    <a href="roles.html">Посади</a>
    <a href="categories.html">Категорії послуг</a>
    <a href="formats.html">Формати друку</a>
    <a href="order_items.html">Позиції замовлень</a>
    <a href="payments.html">Оплати</a>
    <a href="print_files.html">Файли друку</a>
</nav>

<main>
    <h2>Редагування працівника</h2>

    <form action="#" method="post" class="client-form">
 <input type="hidden" id="employee_id" name="employee_id">
 
        <label for="full_name">ПІБ працівника</label>
        <input type="text"
               id="full_name"
               name="full_name"
               maxlength="100"
               required>

        <label for="role_id">Посада</label>
        <select id="role_id" name="role_id" required>
            <option value="">Оберіть посаду</option>
            <option value="1">Адміністратор</option>
            <option value="2">Менеджер</option>
            <option value="3">Друкар</option>
            <option value="4">Фотограф</option>
        </select>

        <label for="phone">Номер телефону</label>
        <input type="tel"
               id="phone"
               name="phone"
               maxlength="20">

        <div class="form-actions">
            <button type="submit">Зберегти зміни</button>
            <a href="employees.html" class="cancel-btn">
                Скасувати
            </a>
        </div>

    </form>
   
</main>

</body>

<script>
    const employees = {
        1: {
            full_name: "Романенко Наталія",
            role_id: "1",
            phone: "+380670000201"
        },
        2: {
            full_name: "Гончаренко Ігор",
            role_id: "2",
            phone: "+380670000202"
        },
        3: {
            full_name: "Дяченко Оксана",
            role_id: "2",
            phone: "+380670000203"
        }
    };

    const params = new URLSearchParams(window.location.search);
    const employeeId = params.get("id");
    const employee = employees[employeeId];

    if (employee) {
        document.getElementById("employee_id").value = employeeId;
        document.getElementById("full_name").value =
            employee.full_name;
        document.getElementById("role_id").value =
            employee.role_id;
        document.getElementById("phone").value =
            employee.phone;
    } else {
        document.querySelector(".client-form").hidden = true;
        document.querySelector("main h2").textContent =
            "Працівника не знайдено";
    }
</script>

</html>
