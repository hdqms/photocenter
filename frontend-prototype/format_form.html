<main>
    <h2>Додати формат друку</h2>

    <form action="#" method="post" class="client-form">

        

<label for="format_name">Назва формату</label>
<input type="text"
       id="format_name"
       name="format_name"
       maxlength="20"
       placeholder="Наприклад, 10x15"
       required>

<label for="paper_type">Тип паперу</label>
<input type="text"
       id="paper_type"
       name="paper_type"
       maxlength="30"
       placeholder="Наприклад, Глянцевий"
       required>


        <div class="form-actions">
            <button type="submit">Зберегти</button>

            <a href="formats.html" class="cancel-btn">
    Скасувати
</a>
        </div>
    </form>
