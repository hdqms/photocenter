<main>
    <h2>Додати фотозал</h2>

    <form action="#" method="post" class="client-form">

        <label for="hall_name">Назва фотозалу</label>
        <input type="text"
               id="hall_name"
               name="hall_name"
               maxlength="50"
               required>

        <label for="hourly_rate">
            Вартість оренди за годину, грн
        </label>
        <input type="number"
               id="hourly_rate"
               name="hourly_rate"
               min="0"
               max="999999.99"
               step="0.01"
               required>

        <label for="capacity">Місткість, осіб</label>
        <input type="number"
               id="capacity"
               name="capacity"
               min="1"
               step="1"
               required>

        <div class="form-actions">
            <button type="submit">Зберегти</button>

            <a href="halls.html" class="cancel-btn">
                Скасувати
            </a>
        </div>
    </form>
</main>

</body>
