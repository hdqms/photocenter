<main>
    <h2>Додати оплату</h2>

    <form action="#" method="post" class="client-form">


<label for="order_id">Замовлення</label>
<select id="order_id" name="order_id" required>
    <option value="">Оберіть замовлення</option>
    <option value="1">Замовлення №1</option>
    <option value="2">Замовлення №2</option>
    <option value="3">Замовлення №3</option>
</select>

<label for="amount">Сума оплати, грн</label>
<input type="number"
       id="amount"
       name="amount"
       min="0.01"
       max="99999999.99"
       step="0.01"
       required>

<label for="payment_date">Дата й час оплати</label>
<input type="datetime-local"
       id="payment_date"
       name="payment_date"
       required>

<label for="payment_type">Спосіб оплати</label>
<select id="payment_type"
        name="payment_type"
        required>
    <option value="">Оберіть спосіб оплати</option>
    <option value="Картка">Картка</option>
    <option value="Готівка">Готівка</option>
</select>



        <div class="form-actions">
            <button type="submit">Зберегти</button>

           <a href="payments.html" class="cancel-btn">
    Скасувати
</a>
        </div>
    </form>
</main>


</body>
</html>
