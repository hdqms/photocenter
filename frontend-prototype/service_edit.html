
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Фотоцентр — Редагування послуги</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Фотоцентр</h1>
    <p>Система управління базою даних</p>
</header>

<nav>
    <a href="index.html">Клієнти</a>
    <a href="services.html">Послуги</a>
    <a href="orders.html">Замовлення</a>
    <a href="bookings.html">Бронювання</a>
    <a href="employees.html">Працівники</a>
    <a href="halls.html">Фотозали</a>
    <a href="roles.html">Посади</a>
    <a href="categories.html">Категорії послуг</a>
    <a href="formats.html">Формати друку</a>
    <a href="order_items.html">Позиції замовлень</a>
    <a href="payments.html">Оплати</a>
    <a href="print_files.html">Файли друку</a>
</nav>

<main>
    <h2>Редагування послуги</h2>

<form action="#" method="post" class="client-form">
<input type="hidden" id="service_id" name="service_id">

    <label for="category_id">Категорія послуги</label>
    <select id="category_id" name="category_id" required>
        <option value="">Оберіть категорію</option>
        <option value="1">Фотодрук</option>
        <option value="2">Документи</option>
        <option value="3">Сувенірна продукція</option>
    </select>

    <label for="service_name">Назва послуги</label>
    <input type="text"
           id="service_name"
           name="service_name"
           maxlength="100"
           required>


        <label for="base_price">Вартість, грн</label>
        <input type="number"
               id="base_price"
               name="base_price"
               min="0"
               step="0.01"
               required>

        <div class="form-actions">
            <button type="submit">Зберегти зміни</button>

            <a href="services.html" class="cancel-btn">
                Скасувати
            </a>
        </div>
    </form>
</main>

<script>
    const services = {
        1: {
    service_name: "Друк фотографій",
    base_price: "50.00",
    category_id: "1"
},
2: {
    service_name: "Ретушування фотографій",
    base_price: "150.00",
    category_id: "1"
}
    };

    const params = new URLSearchParams(window.location.search);
    const serviceId = params.get("id");
    const service = services[serviceId];

    if (service) {

    document.getElementById("service_id").value = serviceId;

       document.getElementById("category_id").value =
    service.category_id;
        document.getElementById("service_name").value =
            service.service_name;
        document.getElementById("base_price").value =
            service.base_price;
    } else {
        document.querySelector(".client-form").hidden = true;
        document.querySelector("main h2").textContent =
            "Послугу не знайдено";
    }
</script>

</body>
</html>
